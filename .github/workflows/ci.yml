name: CI

on:
  pull_request:
    branches:
      - main
      - "phase/**"
  push:
    branches:
      - main
      - "phase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate public instructions and tracked content
        shell: pwsh
        run: ./scripts/validate_instructions.ps1
      - name: Reject whitespace errors
        run: git show --check --oneline --no-renames HEAD

  python:
    name: "Python (${{ matrix.os }})"
    runs-on: "${{ matrix.os }}"
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.7
          python-version: "3.14.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Check Python formatting
        run: uv run ruff format --check .
      - name: Lint Python
        run: uv run ruff check .
      - name: Check Python types
        run: uv run pyright
      - name: Enforce import boundaries
        run: uv run paritygrid-check-boundaries
      - name: Run Python tests and coverage
        run: uv run pytest --cov=paritygrid --cov-report=term-missing
      - name: Run backend smoke check
        run: uv run paritygrid smoke

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Check frontend formatting
        run: npm run format:check
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend types
        run: npm run typecheck
      - name: Run frontend tests and coverage
        run: npm run test:coverage
      - name: Build production frontend
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  frontend-api-smoke:
    name: Frontend API smoke
    needs:
      - python
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install locked Python toolchain
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.7
          python-version: "3.14.4"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Exercise Vite-to-FastAPI proxy
        run: uv run python scripts/verify_frontend_api_path.py
