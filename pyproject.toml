[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "paritygrid"
version = "0.1.0"
description = "Verifiable data reconciliation and observable I/O execution."
readme = "README.md"
requires-python = ">=3.14"
authors = [
  { name = "ParityGrid contributors" },
]
dependencies = [
  "alembic>=1.17,<2",
  "duckdb>=1.5.5,<1.6",
  "fastapi>=0.116,<1",
  "pyarrow>=25,<26",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.52.3,<1",
  "websockets>=15,<16",
]

[project.scripts]
paritygrid = "paritygrid.cli:app"
paritygrid-check-boundaries = "paritygrid.quality.import_boundaries:main"
paritygrid-freeze-v0001 = "paritygrid.quality.frozen_schema:main"

[dependency-groups]
dev = [
  "hypothesis>=6.165.6,<7",
  "httpx>=0.28,<1",
  "pip-audit>=2.9,<3",
  "pyright>=1.1.404,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.16.3,<1",
  "pyarrow-stubs>=20.0.0.20260625,<21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paritygrid"]

[tool.hatch.build.targets.wheel.force-include]
"web/dist" = "src/paritygrid/_frontend"

[tool.pyright]
include = [
  "src",
  "tests",
  "scripts/verify_frontend_api_path.py",
  "scripts/export_openapi.py",
  "scripts/generate_api_types.py",
  "scripts/verify_frontend_dist.py",
  "scripts/verify_python_dependencies.py",
  "scripts/verify_python_coverage.py",
  "scripts/verify_wheel_install.py",
]
exclude = [".venv", "tests/fixtures"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["paritygrid"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = [
  "A",
  "ANN",
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PERF",
  "PIE",
  "PT",
  "RUF",
  "SIM",
  "UP",
  "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN401"]
"src/paritygrid/api/ts_generation.py" = ["ANN401"]
"src/paritygrid/api/openapi_export.py" = ["ANN401"]
